[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alien-fingers"
version = "0.1.0"
description = "A safety-first natural language shell agent CLI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "alien-fingers contributors" }]
license = { text = "MIT" }
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
alien-fingers = "alien_finger.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
